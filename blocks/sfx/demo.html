<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>sfx block demo</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #a-roll { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="demo_sfx"
      data-start="0"
      data-duration="5"
      data-width="1080"
      data-height="1920"
    >
      <video
        id="a-roll"
        class="clip"
        src="../_sandbox/sample_5s.mp4"
        playsinline
        data-start="0"
        data-duration="5"
        data-has-audio="true"
      ></video>
      <!-- sfx: one normalised audio hit. The audio element is the timed element. -->
      <audio
        id="demo_sfx-audio"
        class="clip"
        src="assets/sfx/impact_boom.wav"
        data-start="1.2"
        data-duration="1.6"
        data-volume="0.8"
        data-fade-out="0.25"
      ></audio>
    </div>
    <script>
      window.HF_BLOCKS = window.HF_BLOCKS || {};
      // sfx — no visual animation. Timing, gain and fades are declarative attributes
      // on the <audio> element; the file itself is loudness-normalised at compose time.
      window.HF_BLOCKS = window.HF_BLOCKS || {};
      window.HF_BLOCKS.sfx = function (tl, id, p, meta) {
        // Intentionally empty: the mix reads data-start / data-duration / data-volume.
        return;
      };
      const tl = gsap.timeline({ paused: true });
      HF_BLOCKS["sfx"](tl, "demo_sfx", {"asset_id": "impact_boom", "gain": 0.8, "loudness_lufs": -16}, {"start": 1.2});
      window.__timelines = window.__timelines || {};
      window.__timelines["demo_sfx"] = tl;
    </script>
  </body>
</html>
