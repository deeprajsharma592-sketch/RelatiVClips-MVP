<style>
#studio-tower-orbit canvas { display:block; width:100%; height:clamp(360px,65vw,570px); background:radial-gradient(ellipse at 50% 45%, color-mix(in srgb, var(--background) 82%, var(--foreground)), var(--background) 72%); touch-action:none; cursor:grab; }
#studio-tower-orbit canvas:active { cursor:grabbing; }
#studio-tower-orbit .viz-controls { justify-content:center; }
</style>
<script>
(async () => {
  const root = document.getElementById('studio-tower-orbit');
  const canvas = root.querySelector('canvas');
  const button = root.querySelector('[data-spin]');
  const slider = root.querySelector('input');
  const status = root.querySelector('[role=status]');
  try {
    const gl = canvas.getContext('webgl2', {alpha:true,antialias:true});
    if (!gl) throw new Error('WebGL 2 unavailable');
    const vertex = `#version 300 es
    in vec3 position; in vec3 normal; in vec2 uv;
    uniform vec4 camera; uniform float aspect;
    out vec3 n; out vec2 t;
    vec3 orbit(vec3 p) {
      vec3 q=vec3(camera.y*p.x+camera.x*p.z,p.y,camera.y*p.z-camera.x*p.x);
      return vec3(q.x,camera.w*q.y-camera.z*q.z,camera.z*q.y+camera.w*q.z);
    }
    void main() {
      vec3 q=orbit(position-vec3(0.,3.79,0.));
      float w=1.-q.z/17.;
      gl_Position=vec4(q.x*.216/aspect,q.y*.216,-q.z*.06,w);
      n=orbit(normal); t=uv;
    }`;
    const fragment = `#version 300 es
    precision mediump float;
    in vec3 n; in vec2 t; out vec4 color;
    uniform bool textured; uniform sampler2D image; uniform vec3 metal;
    void main() {
      vec3 N=normalize(n);
      float diffuse=max(dot(N,vec3(-.42,.69,.59)),0.);
      if (textured) {
        color=vec4(texture(image,t).rgb*(.86+.14*diffuse),1.);
      } else {
        float rim=pow(1.-clamp(N.z,0.,1.),3.);
        float sheen=pow(max(dot(N,vec3(-.54,.34,.77)),0.),23.);
        float strip=pow(max(dot(N,vec3(.72,.22,.66)),0.),46.);
        float roof=pow(max(dot(N,vec3(.18,.89,.41)),0.),14.);
        color=vec4((vec3(.05)+metal*.51)*(.68+.46*diffuse)+rim*vec3(.31,.34,.40)+sheen*vec3(.46,.46,.48)+strip*vec3(.27,.31,.39)+roof*vec3(.32,.33,.36),1.);
      }
    }`;
    const program = gl.createProgram();
    for (const [type,source] of [[gl.VERTEX_SHADER,vertex],[gl.FRAGMENT_SHADER,fragment]]) {
      const shader=gl.createShader(type);
      gl.shaderSource(shader,source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
      gl.attachShader(program,shader);
    }
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
    gl.useProgram(program);
    const uniforms=Object.fromEntries(['camera','aspect','textured','metal'].map(key=>[key,gl.getUniformLocation(program,key)]));
    const [mesh,images]=JSON.parse(root.querySelector('[type="application/json"]').textContent);
    const bytes = value => Uint8Array.from(atob(value),c=>c.charCodeAt(0));
    const textures=await Promise.all(images.map(async data=>{
      const dataUrl='data:image/jpeg;base64,'+data;
      const image=new Image();
      image.src=dataUrl;
      await image.decode();
      const id=gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D,id);
      gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,image);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);
      gl.generateMipmap(gl.TEXTURE_2D);
      return id;
    }));
    const meshes=await Promise.all(mesh.map(async ([count,indexCount,color,texture,data])=>{
      const stream=new Blob([bytes(data)]).stream().pipeThrough(new DecompressionStream('gzip'));
      const raw=await new Response(stream).arrayBuffer();
      const vao=gl.createVertexArray();
      gl.bindVertexArray(vao);
      const attributes=[
        ['position',3,new Int16Array(raw,0,count*3),4096],
        ['normal',3,new Int8Array(raw,count*6,count*3),127],
        ['uv',2,null,32767]
      ];
      const uvOffset=count*9;
      const packed=new DataView(raw);
      attributes[2][2]=Int16Array.from({length:count*2},(_,i)=>packed.getInt16(uvOffset+i*2,true));
      for (const [name,size,array,factor] of attributes) {
        const location=gl.getAttribLocation(program,name);
        gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());
        gl.bufferData(gl.ARRAY_BUFFER,Float32Array.from(array,x=>x/factor),gl.STATIC_DRAW);
        gl.enableVertexAttribArray(location);
        gl.vertexAttribPointer(location,size,gl.FLOAT,false,0,0);
      }
      const delta=new Int16Array(raw,Math.ceil(count*13/2)*2,indexCount);
      let previous=0;
      const indices=Uint32Array.from(delta,value=>(previous+=value));
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,gl.createBuffer());
      gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,indices,gl.STATIC_DRAW);
      return {vao,indexCount,color,texture};
    }));
    gl.enable(gl.DEPTH_TEST);
    gl.enable(gl.CULL_FACE);
    gl.clearColor(0,0,0,0);
    const tau=Math.PI*2;
    let azimuth=0, pitch=.08, drag=null, spinning=false, last=0;
    const angle=()=>((Math.round(azimuth*180/Math.PI)%360)+360)%360;
    function draw(){
      const rect=canvas.getBoundingClientRect();
      const ratio=Math.min(window.devicePixelRatio||1,2);
      const width=Math.max(1,Math.round(rect.width*ratio));
      const height=Math.max(1,Math.round(rect.height*ratio));
      if(canvas.width!==width || canvas.height!==height){canvas.width=width;canvas.height=height;}
      gl.viewport(0,0,width,height);
      gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
      gl.uniform4f(uniforms.camera,Math.sin(azimuth),Math.cos(azimuth),Math.sin(pitch),Math.cos(pitch));
      gl.uniform1f(uniforms.aspect,width/height);
      for(const mesh of meshes){
        gl.bindVertexArray(mesh.vao);
        gl.uniform1i(uniforms.textured,mesh.texture>=0);
        gl.uniform3fv(uniforms.metal,mesh.color);
        gl.bindTexture(gl.TEXTURE_2D,textures[mesh.texture]||null);
        gl.drawElements(gl.TRIANGLES,mesh.indexCount,gl.UNSIGNED_INT,0);
      }
    }
    function animate(now){
      if(!spinning)return;
      if(last) azimuth-=Math.min(now-last,80)*tau/18000;
      last=now;
      slider.value=angle();
      draw();
      requestAnimationFrame(animate);
    }
    function stop(){
      spinning=false;
      last=0;
      button.setAttribute('aria-pressed','false');
    }
    button.addEventListener('click',()=>{
      if(spinning){stop();return;}
      spinning=true;
      button.setAttribute('aria-pressed','true');
      requestAnimationFrame(animate);
    });
    slider.addEventListener('input',()=>{
      stop();
      azimuth=Number(slider.value)*Math.PI/180;
      draw();
    });
    canvas.addEventListener('pointerdown',event=>{
      stop();
      drag={id:event.pointerId,x:event.clientX,y:event.clientY};
      canvas.setPointerCapture(event.pointerId);
    });
    canvas.addEventListener('pointermove',event=>{
      if(drag?.id!==event.pointerId)return;
      azimuth+=(event.clientX-drag.x)*.011;
      pitch=Math.max(-1.1,Math.min(1.1,pitch+(event.clientY-drag.y)*.009));
      drag={id:event.pointerId,x:event.clientX,y:event.clientY};
      slider.value=angle();
      draw();
    });
    canvas.addEventListener('lostpointercapture',()=>{drag=null;});
    new ResizeObserver(draw).observe(canvas);
    draw();
    button.disabled=slider.disabled=false;
    status.hidden=true;
  } catch(error) {
    status.textContent='The 3D viewer could not load.';
    console.error(error);
  }
})();
</script>

#studio-tower-orbit canvas { height: calc(100dvh - 64px); min-height: 255px; }
.viz-controls { display: flex; align-items: center; gap: 16px; min-height: 64px; padding: 8px 12px; }
.form-label { display: flex; align-items: center; gap: 8px; }
.form-range { width: clamp(80px, 26vw, 220px); accent-color: #fff; }
.btn { color: inherit; font: inherit; background: #17171b; border: 1px solid #45454e; border-radius: 999px; padding: 9px 14px; white-space: nowrap; }
.btn[aria-pressed="true"] { background: #f3f3f5; color: #111; }
</style>
