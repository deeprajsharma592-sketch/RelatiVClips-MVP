[pytest]
# The product's suite lives in tests/unit and tests/integration and needs the
# product's deps. The edit engine's suite is self-contained and runs on its own.
testpaths = tests/edit_engine
python_files = test_*.py
addopts = -q
markers =
    slow: renders real video with Hyperframes (tens of seconds per render)
    live: needs a real model API key; skipped unless EDIT_LIVE=1
filterwarnings =
    ignore::DeprecationWarning
